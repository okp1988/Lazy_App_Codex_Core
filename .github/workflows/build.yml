name: Lazy App Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build Lazy App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Lazy_App_Codex_Core.sln

      - name: Build
        run: dotnet build Lazy_App_Codex_Core.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Lazy_App_Codex_Core.csproj --configuration Release --no-restore --output publish

      - name: Include default config
        run: Copy-Item config.json publish\config.json -Force

      - name: Package release
        run: Compress-Archive -Path publish\* -DestinationPath lazy-app-release.zip -Force

      - name: Upload Lazy App artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazy-app-release
          path: lazy-app-release.zip

      - name: Create latest GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: latest
        run: |
          gh release delete $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }

          git push origin ":refs/tags/$env:TAG_NAME" 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }

          gh release create $env:TAG_NAME lazy-app-release.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Lazy App latest" `
            --notes "Automated latest release for commit $env:GITHUB_SHA" `
            --latest
