name: Lazy App Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build Lazy App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Lazy_App_Codex_Core.sln

      - name: Build
        run: dotnet build Lazy_App_Codex_Core.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Lazy_App_Codex_Core.csproj --configuration Release --no-restore --output publish

      - name: Package release
        run: Compress-Archive -Path publish\* -DestinationPath lazy-app-release.zip -Force

      - name: Upload Lazy App artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazy-app-release
          path: lazy-app-release.zip

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: auto-release-${{ github.run_number }}
        run: |
          gh release create $env:TAG_NAME lazy-app-release.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Lazy App $env:TAG_NAME" `
            --notes "Automated release for commit $env:GITHUB_SHA"
