name: Lazy App Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Lazy App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Lazy_App_Codex_Core.sln

      - name: Build
        run: dotnet build Lazy_App_Codex_Core.sln --configuration Release --no-restore

      - name: Upload Lazy App artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazy-app-release
          path: |
            bin/Release/net8.0-windows/**/*
