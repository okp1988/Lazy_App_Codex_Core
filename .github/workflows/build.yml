name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore Lazy_App_Codex_Core.sln
      - run: dotnet build Lazy_App_Codex_Core.sln --configuration Release --no-restore

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            **/bin/Release/**/*